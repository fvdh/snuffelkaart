# Elke nacht (§6.1): markten opnieuw uitlezen, openingstijden vooruitrekenen, testen, bouwen, uitrollen naar Cloudflare.
# Nodig: secret CLOUDFLARE_API_TOKEN (Freek; rechten "Workers Scripts: Edit"). Handmatig starten kan via "Run workflow".
# ponytail: OSM, Overture en websitetijden ververst dit niet; die import draait nog met de hand (wekelijks: Geofabrik, §5.1).
name: Nachtelijke verversing
on:
  schedule:
    - cron: '30 2 * * *' # 03:30 of 04:30 Nederlandse tijd
  workflow_dispatch:
permissions:
  contents: write
concurrency: nachtelijk
jobs:
  ververs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Markten opnieuw uitlezen
        run: node scripts/fetch-markets.mjs
        continue-on-error: true # gaat één organisator mis, dan blijft zijn vorige stand staan; de rest gaat door
      - name: Openingstijden vooruitrekenen vanaf vandaag
        run: node scripts/refresh-hours.mjs
      - run: npm test
      - run: npm run build
      - name: Uitrollen naar Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Gegevens bewaren in de repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || { git commit -m "Gegevens ververst $(date +%F)" && git push; }

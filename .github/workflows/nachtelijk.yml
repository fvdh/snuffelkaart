# Elke nacht (§6.1): markten opnieuw uitlezen → Supabase; Supabase → kaartdata (tijden vooruitgerekend); testen, bouwen, uitrollen.
# Secrets: CLOUDFLARE_API_TOKEN, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY (mail bij meldingen). Handmatig starten kan via "Run workflow".
# De dagelijkse schrijfactie houdt het gratis Supabase-project wakker.
# Elk kwartier: alleen als iemand in /beheer iets wijzigde (updated_at na de laatste export) exporteren, bouwen en uitrollen.
# ponytail: polling via cron (repo is publiek, minuten gratis; GitHub-cron loopt soms wat achter). Sneller = Supabase-webhook → repository_dispatch.
# Winkels (OSM, Overture, websitetijden) ververst winkels.yml op maandagnacht; deze run zet ze daarna op de kaart.
name: Nachtelijke verversing
# Gestart door de klok (app/worker/klok.js, Cloudflare-cron): elk kwartier modus=kwartier, om 02:30 UTC modus=alles.
on:
  workflow_dispatch:
    inputs:
      modus:
        description: 'alles = markten opnieuw uitlezen en publiceren; kwartier = alleen publiceren als er in beheer iets wijzigde'
        type: choice
        options: [alles, kwartier]
        default: alles
permissions:
  contents: write
concurrency: nachtelijk
jobs:
  ververs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - name: Wat te doen
        id: w
        env: &supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.modus }}" != 'kwartier' ]; then echo doe=alles >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(jq -r .generated public/data/markets.json)
          { for t in markets places; do
              curl -sf "$SUPABASE_URL/rest/v1/$t?select=id&updated_at=gt.$since&limit=1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"
            done
            curl -sf "$SUPABASE_URL/rest/v1/contributions?select=id&decided_at=gt.$since&limit=1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"; } | grep -q '"id"' && echo doe=publiceer >> "$GITHUB_OUTPUT" || echo "Niets gewijzigd sinds $since"
      - uses: actions/setup-node@v5
        if: steps.w.outputs.doe
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        if: steps.w.outputs.doe
      - name: Markten opnieuw uitlezen
        id: markten
        if: steps.w.outputs.doe == 'alles'
        run: node scripts/fetch-markets.mjs
        continue-on-error: true # gaat één organisator mis, dan blijft zijn vorige stand staan; de rest gaat door
      - name: Markten naar Supabase
        if: steps.w.outputs.doe == 'alles'
        run: cp public/data/markets.json "$RUNNER_TEMP/gelezen.json" && node scripts/db.mjs push markets # kopie: de export overschrijft het bestand
        env: *supabase
      - name: Gemeenteblad → kandidaten (keuren in /beheer)
        id: gemeenteblad
        if: steps.w.outputs.doe == 'alles'
        run: node scripts/fetch-gemeenteblad.mjs
        continue-on-error: true
        env: *supabase
      - name: Mail bij nieuwe meldingen
        if: steps.w.outputs.doe == 'alles'
        run: node scripts/meldingen-mail.mjs
        continue-on-error: true # een mislukte mail mag de kaart niet tegenhouden
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }} # ontbreekt hij, dan slaat het script over
      - name: Kaartdata uit Supabase (tijden vooruit vanaf vandaag)
        if: steps.w.outputs.doe
        run: node scripts/db.mjs export
        env: *supabase
      - run: npm test
        if: steps.w.outputs.doe
      - run: npm run build
        if: steps.w.outputs.doe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }} # publishable key voor /beheer; niet geheim
          CF_BEACON: ${{ vars.CF_BEACON }} # Cloudflare Web Analytics; niet geheim
      - name: Uitrollen naar Cloudflare
        if: steps.w.outputs.doe
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Gegevens bewaren in de repo
        if: steps.w.outputs.doe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          # Iemand kan intussen gepusht hebben (handmatige deploy): eerst bijwerken, bij een botsing wint de verse data.
          push() { for i in 1 2 3; do git push && return; git pull --rebase -X theirs || return 1; done; return 1; }
          git diff --cached --quiet || { git commit -m "Gegevens ververst $(date +%F) (${{ steps.w.outputs.doe }})" && push; }
      # M4: een uitlezer die stukgaat, wordt gemeld. De rest is dan al uitgerold; de run wordt rood en GitHub mailt.
      - name: Uitlezers gecontroleerd
        if: steps.w.outputs.doe == 'alles'
        run: |
          fout=0
          [ "${{ steps.markten.outcome }}" = failure ] && { echo "::error::fetch-markets is mislukt"; fout=1; }
          [ "${{ steps.gemeenteblad.outcome }}" = failure ] && { echo "::error::Gemeenteblad-uitlezer is mislukt"; fout=1; }
          jq -r '.problems[]? | "::error::\(.org): \(.why)"' "$RUNNER_TEMP/gelezen.json" | tee /dev/stderr | grep -q . && fout=1
          exit $fout

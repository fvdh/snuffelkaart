# Elke nacht (§6.1): markten opnieuw uitlezen → Supabase; Supabase → kaartdata (tijden vooruitgerekend); testen, bouwen, uitrollen.
# Secrets: CLOUDFLARE_API_TOKEN, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY. Handmatig starten kan via "Run workflow".
# De dagelijkse schrijfactie houdt het gratis Supabase-project wakker.
# ponytail: OSM, Overture en websitetijden ververst dit niet; die import draait nog met de hand (wekelijks: Geofabrik, §5.1).
name: Nachtelijke verversing
on:
  schedule:
    - cron: '30 2 * * *' # 03:30 of 04:30 Nederlandse tijd
  workflow_dispatch:
permissions:
  contents: write
concurrency: nachtelijk
jobs:
  ververs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Markten opnieuw uitlezen
        run: node scripts/fetch-markets.mjs
        continue-on-error: true # gaat één organisator mis, dan blijft zijn vorige stand staan; de rest gaat door
      - name: Markten naar Supabase
        run: node scripts/db.mjs push markets
        env: &supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Gemeenteblad → kandidaten (keuren in /beheer)
        run: node scripts/fetch-gemeenteblad.mjs
        continue-on-error: true
        env: *supabase
      - name: Kaartdata uit Supabase (tijden vooruit vanaf vandaag)
        run: node scripts/db.mjs export
        env: *supabase
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }} # publishable key voor /beheer; niet geheim
      - name: Uitrollen naar Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Gegevens bewaren in de repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || { git commit -m "Gegevens ververst $(date +%F)" && git push; }

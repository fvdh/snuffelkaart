# M6 monitoring van buitenaf, elk half uur: werkt de site, zijn de kaartgegevens vers, antwoordt Supabase?
# Mislukt een controle, dan wordt de run rood en mailt GitHub (aan wie de workflow het laatst wijzigde).
# ponytail: een half uur is ruim genoeg voor een "ligt eruit"-seintje.
name: Controle
on:
  workflow_dispatch: # elk half uur gestart door de klok (app/worker/klok.js)
jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site, gegevens en statusbestand
        env:
          SITE: https://snuffelkaart.ironfront-relay.workers.dev
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          fout=0
          curl -sf --max-time 20 "$SITE/" | grep -q '<title>' || { echo "::error::De kaart ($SITE) laadt niet"; fout=1; }
          for f in places markets; do
            gen=$(curl -sf --max-time 30 "$SITE/data/$f.json" | jq -r .generated) || gen=""
            if [ -z "$gen" ]; then echo "::error::$f.json laadt niet"; fout=1; continue; fi
            oud=$(( ( $(date +%s) - $(date -d "$gen" +%s) ) / 3600 ))
            [ "$oud" -gt 36 ] && { echo "::error::$f.json is $oud uur oud: de nachtelijke run publiceert niet"; fout=1; }
            echo "$f.json: $oud uur oud"
          done
          curl -sf --max-time 20 -X POST "$SUPABASE_URL/rest/v1/rpc/market_status" -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' -d '{}' | jq -e .at >/dev/null \
            || { echo "::error::Supabase antwoordt niet (statusbestand); inloggen, meldingen en afgelastingen werken dan niet"; fout=1; }
          exit $fout

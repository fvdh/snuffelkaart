# M4: elke nacht een back-up van Supabase naar R2 (privé bucket snuffelkaart-backup, na 30 dagen automatisch weg), en de RLS-test.
# Secrets: SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens), CLOUDFLARE_API_TOKEN (met "Workers R2 Storage: Edit").
# Terugzetten (nieuw Supabase-project, of lokaal om te oefenen):
#   npx wrangler r2 object get snuffelkaart-backup/<datum>/schema.sql.gz --remote --file schema.sql.gz  (en data.sql.gz)
#   gunzip *.gz && psql "<connection string>" -f schema.sql && psql "<connection string>" -f data.sql
# Geoefend op 2026-10-28 in een lege supabase/postgres-container: alle public-tabellen exact terug (zie DECISIONS.md).
name: Nachtelijke back-up
on:
  # Schema gaat aan zodra de secrets er staan (anders elke nacht een rode run):
  # schedule:
  #   - cron: '0 2 * * *' # 03:00 of 04:00 Nederlandse tijd, vóór de verversing
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: gldbcdrlojsgcltpxctj
    steps:
      - uses: actions/checkout@v5
      - name: Dump (schema, en data van public en auth)
        run: |
          npx --yes supabase@2 db dump --project-ref "$REF" -f schema.sql
          npx --yes supabase@2 db dump --project-ref "$REF" --data-only --use-copy -s public,auth -f data.sql
          test -s schema.sql && test -s data.sql
          gzip -9 schema.sql data.sql
      - name: Naar R2
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          d=$(date +%F)
          for f in schema data; do npx --yes wrangler@4 r2 object put "snuffelkaart-backup/$d/$f.sql.gz" --file "../$f.sql.gz" --remote; done
      - name: RLS-test
        run: npx --yes supabase@2 db query --project-ref "$REF" -f supabase/tests/rls.sql

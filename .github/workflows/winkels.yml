# Elke week (§5.1): winkels opnieuw uit OpenStreetMap en Overture, openingstijden van hun websites → Supabase.
# De nachtelijke run van 02:30 UTC zet het daarna op de kaart (export, bouwen, uitrollen); deze job schrijft alleen naar Supabase.
# Verdwenen winkels worden verborgen (niet gewist); meer dan 10% weg = fout, dan schrijft db.mjs niets. Zie placeRows in db.mjs.
# Overture in de cache per release (maandelijks nieuw). Websitetijden staan in de repo (data-raw/web-hours.json): fetch-web-hours leest
# alleen wat ouder is dan 7 dagen en houdt bij een fout de laatst gelezen tijden (2 nov: GitHub-servers worden door sommige sites geweigerd).
# ponytail: Overpass in 9 vakken i.p.v. het Geofabrik-extract + osmium; overstappen als Overpass vaak weigert.
name: Winkels wekelijks
on:
  workflow_dispatch: # maandag 00:30 UTC gestart door de klok (app/worker/klok.js), ruim vóór de nachtelijke export
permissions:
  contents: write # websitetijden bewaren in de repo
jobs:
  winkels:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Nieuwste Overture-release
        id: ov
        run: echo "release=$(curl -sf https://stac.overturemaps.org/catalog.json | jq -r .latest)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: ovcache
        with:
          path: app/data-raw/overture.json
          key: overture-v2-${{ steps.ov.outputs.release }} # v2: met socials (Facebook)
      - name: Overture ophalen (alleen bij een nieuwe release)
        if: steps.ovcache.outputs.cache-hit != 'true'
        run: node scripts/fetch-overture.mjs "${{ steps.ov.outputs.release }}"
      - name: Openingstijden van websites
        run: node scripts/fetch-web-hours.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }} # AI-lezer (Cloudflare Workers AI); ontbreekt hij, dan staat de AI-lezer uit
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          AI_MAX: '250' # ±32 neurons per vraag (gemeten 6 nov), gratis 10.000 per dag
        timeout-minutes: 45
        continue-on-error: true # deels gelezen is ook goed; het bestand wordt tussendoor bewaard
      - name: Websitetijden bewaren in de repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-raw/web-hours.json
          push() { for i in 1 2 3; do git push && return; git pull --rebase -X theirs || return 1; done; return 1; }
          git diff --cached --quiet || { git commit -m "Websitetijden gelezen $(date +%F)" && push; }
      - name: OpenStreetMap + samenvoegen
        run: |
          test -s data-raw/overture.json && test -s data-raw/web-hours.json || { echo "::error::Overture of websitetijden ontbreekt; niets geschreven"; exit 1; }
          node scripts/fetch-osm.mjs
      - run: npm test
      - name: Winkels naar Supabase
        run: node scripts/db.mjs push places
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
